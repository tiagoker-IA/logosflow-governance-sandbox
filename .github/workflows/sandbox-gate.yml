name: Synthetic governance sandbox
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate for comparison (never execute its scripts)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trusted validator self-tests
        working-directory: trusted
        run: node scripts/selftest.js
      - name: Gate pull request with trusted base validator
        if: github.event_name == 'pull_request'
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate.js
